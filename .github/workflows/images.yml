name: Publish container images

on:
  push:
    branches: [main]
    paths:
      - lemmy/**
      - proxy/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lemmy
            dockerfile: lemmy/Dockerfile
          - name: proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/railway-template-lemmy-${{ matrix.name }}:0.19.20
            ghcr.io/${{ github.repository_owner }}/railway-template-lemmy-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Lemmy Railway template ${{ matrix.name }} image
